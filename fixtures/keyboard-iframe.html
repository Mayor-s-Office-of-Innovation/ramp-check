</head>

  <main id="main">

    <p><button type="button" id="before">Before</button></p>
    <iframe id="frame" title="Embedded controls" srcdoc="<!doctype html><html lang='en'><head><title>Embedded</title><style>button:focus-visible{outline:3px solid #0b4f8a}</style></head><body><button>One</button> <button>Two</button> <button>Three</button></body></html>"></iframe>
    <p><button type="button" id="after">After</button></p>
