<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflow: fixed-width content</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; }
    /* Seeded defect: a fixed 600px card forces horizontal scrolling at 320px. */
    .card { width: 600px; padding: 1rem; border: 1px solid #1a1a1a; }
  </style>
</head>
<body>
  <main id="main">
    <h1>Fixed-width content</h1>
    <div class="card" id="wide">This card is 600 px wide and does not shrink, so the page scrolls sideways on a narrow screen.</div>
  </main>
</body>
</html>
