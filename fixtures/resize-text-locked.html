<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resize text: px-locked text</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; max-width: 60ch; margin: 0 auto; }
    /* Seeded defect: font sizes in px — the user's font-size preference does
       not scale them ("set exactly so it doesn't grow"). */
    .card-px { font-size: 16px; border: 1px solid #1a1a1a; padding: .75rem; margin-bottom: 1rem; }
    .card-px .title { font-size: 24px; font-weight: 600; }
    .card-px small { font-size: 12px; }
    /* Not a defect: sized in rem — grows with the default. */
    .card-rem { font-size: 1rem; border: 1px solid #1a1a1a; padding: .75rem; margin-bottom: 1rem; }
    .card-rem .title { font-size: 1.5rem; font-weight: 600; }
    .card-rem small { font-size: .75rem; }
    /* Nested case: the outer .card-px2 owns the px size; the inner span
       inherits it and must not be reported separately. */
    .card-px2 { font-size: 14px; border: 1px solid #1a1a1a; padding: .75rem; }
  </style>
</head>
<body>
  <main id="main">
    <h1 style="font-size: 1.75rem">Resize text</h1>
    <div class="card-rem" id="rem-card">
      <div class="title">This card is rem-sized</div>
      <p>Its text follows the default font size.</p>
      <small>A rem-based footnote.</small>
    </div>
    <div class="card-px" id="px-card">
      <div class="title">This card is px-locked</div>
      <p>When the default font size doubles, this text stays exactly its size.</p>
      <small>A px-locked footnote.</small>
    </div>
    <div class="card-px2" id="px-nested">
      Outer px text with an <span id="px-inherited">inherited inner span</span>.
    </div>
  </main>
</body>
</html>
