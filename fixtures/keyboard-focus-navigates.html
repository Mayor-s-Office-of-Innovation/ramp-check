<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard: navigation on focus</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; max-width: 60ch; margin: 0 auto; }
    button, select { font: inherit; padding: .5rem 1rem; }
    :focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="main">
    <h1>Navigation on focus</h1>
    <p>Seeded defect: merely focusing the second control sends the user to another page.</p>
    <p><button type="button" id="first">First</button></p>
    <p><label for="jump">Jump to</label> <select id="jump" onfocus="location.href='/clean.html'"><option>Home</option></select></p>
    <p><button type="button" id="never">Never reached</button></p>
  </main>
</body>
</html>
