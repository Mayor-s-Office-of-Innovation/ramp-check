<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>axe: text fading in</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; max-width: 60ch; margin: 0 auto; }
    /* Not a defect: the text ends at full contrast. A scan that does not wait
       for the fade measures a blended color and reports a bogus violation. */
    @keyframes fade-in { from { opacity: 0.02; } to { opacity: 1; } }
    .fade { animation: fade-in 3s linear; }
  </style>
</head>
<body>
  <main id="main">
    <h1>Text fading in</h1>
    <p class="fade" id="fading">This paragraph is fully readable once its three second fade finishes.</p>
  </main>
</body>
</html>
