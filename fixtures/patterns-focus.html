<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patterns: focus after an action</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; max-width: 60ch; margin: 0 auto; }
    button, input { font: inherit; padding: .5rem 1rem; }
    button { background: #0b4f8a; color: #fff; border: 0; border-radius: 4px; }
    :focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
    [hidden] { display: none; }
    h2:focus { outline: 3px solid #0b4f8a; }
  </style>
</head>
<body>
  <main id="main">
    <h1>Focus after an action</h1>
    <p><button type="button" id="reveal-good">Show details (moves focus)</button></p>
    <p><button type="button" id="reveal-bad">Show details (leaves focus)</button></p>
    <section id="details" hidden>
      <h2 id="details-title" tabindex="-1">Details</h2>
      <p>Some details.</p>
    </section>
  </main>
  <script>
    document.getElementById("reveal-good").addEventListener("click", () => {
      const s = document.getElementById("details"); s.hidden = false; document.getElementById("details-title").focus();
    });
    document.getElementById("reveal-bad").addEventListener("click", () => {
      document.getElementById("details").hidden = false;
    });
  </script>
</body>
</html>
