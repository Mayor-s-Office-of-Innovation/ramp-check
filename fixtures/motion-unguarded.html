<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion: no reduced-motion guard</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; line-height: 1.5; }
    main { padding: 1rem; max-width: 60ch; margin: 0 auto; }
    button { font: inherit; padding: .5rem 1rem; background: #0b4f8a; color: #fff; border: 0; border-radius: 4px; }
    button:focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
    /* Seeded defect 1: a finite entrance animation with no reduced-motion guard. */
    @keyframes hero-in { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
    .hero { animation: hero-in 4s ease-out; }
    /* No @media (prefers-reduced-motion: reduce) block anywhere on this page. */
  </style>
</head>
<body>
  <main id="main">
    <h1 class="hero">Motion without a guard</h1>
    <p>Three seeded defects: a 4 s entrance animation, an infinite spinner inside a shadow root, and a view transition on the button, none of which stop under reduced motion.</p>
    <!-- Seeded defect 2: infinite animation inside an open shadow root. -->
    <loading-spinner></loading-spinner>
    <p id="content">Page one</p>
    <p><button type="button" id="next">Go to page two</button></p>
  </main>
  <script>
    customElements.define("loading-spinner", class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <style>
            @keyframes spin { to { rotate: 360deg; } }
            .ring { width: 32px; height: 32px; border: 4px solid #ccd; border-top-color: #0b4f8a; border-radius: 50%; animation: spin 1s linear infinite; }
          </style>
          <div class="ring" role="status" aria-label="Loading"></div>`;
      }
    });
    // Seeded defect 3: a same-document view transition. The API does not skip
    // under reduced motion on its own, and the default cross-fade runs on
    // ::view-transition-old/new(root), which a `*` rule cannot reach.
    document.getElementById("next").addEventListener("click", () => {
      const swap = () => { document.getElementById("content").textContent = "Page two"; };
      if (document.startViewTransition) document.startViewTransition(swap); else swap();
    });
  </script>
</body>
</html>
